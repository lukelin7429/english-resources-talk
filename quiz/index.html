<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端午節英文小考 · Dragon Boat Festival English Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1F5C; --navy2:#162a6e; --navy3:#1a3a7a;
    --gold:#FCC30B; --gold-soft:#fff3b8; --gold-deep:#b88a00;
    --green:#3F7E44; --red:#b03a3a; --teal:#00A99D;
    --light:#F4F6FB; --paper:#fff; --ink:#1A1A2E; --muted:#5b6577; --line:#e3e7f0;
    --zh:'PingFang TC','Apple LiGothic Medium','Microsoft JhengHei','Heiti TC',sans-serif;
    --en:'Montserrat','Lato','Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--zh);
    background:var(--light);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .en{font-family:var(--en)}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--navy3) 100%);
    color:#fff;
    padding:1.6rem 1.4rem 1.8rem;
    text-align:center;
  }
  header .badge{
    display:inline-block;background:rgba(252,195,11,.15);border:1px solid var(--gold);
    color:var(--gold);border-radius:50px;padding:.25rem .9rem;
    font-family:var(--en);font-weight:700;font-size:.72rem;letter-spacing:.18em;
    text-transform:uppercase;margin-bottom:.9rem;
  }
  header h1{font-size:clamp(1.4rem,5.5vw,2rem);font-weight:800;line-height:1.25;margin-bottom:.3rem}
  header .en-title{font-family:var(--en);font-size:clamp(.95rem,3vw,1.15rem);color:var(--gold-soft);font-style:italic;font-weight:600}

  /* ---------- containers ---------- */
  main{max-width:780px;margin:0 auto;padding:1.4rem 1rem 4rem}
  .panel{
    background:var(--paper);border-radius:16px;
    box-shadow:0 4px 22px rgba(10,31,92,.08);
    padding:1.5rem 1.3rem;margin-bottom:1.1rem;
    border-top:4px solid var(--gold);
  }
  .panel h2{font-size:1.25rem;color:var(--navy);margin-bottom:.4rem;font-weight:800}
  .panel .sub{color:var(--muted);font-size:.9rem;margin-bottom:1rem}

  /* ---------- form ---------- */
  label.field{display:block;margin-bottom:1rem}
  label.field .lab{display:block;font-weight:700;color:var(--navy);margin-bottom:.35rem;font-size:1rem}
  label.field .lab .en{color:var(--muted);font-weight:600;font-size:.85em;margin-left:.4em}
  input[type=text]{
    width:100%;padding:.85rem 1rem;font-size:1.05rem;font-family:var(--zh);
    border:2px solid var(--line);border-radius:10px;background:#fff;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;appearance:none;
  }
  input[type=text]:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,92,.12)}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block;padding:.95rem 1.6rem;border-radius:50px;border:none;cursor:pointer;
    font-size:1.05rem;font-weight:700;font-family:var(--zh);transition:transform .1s, box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{background:var(--navy);color:var(--gold)}
  .btn-primary:hover{box-shadow:0 6px 18px rgba(10,31,92,.3)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-secondary{background:transparent;color:var(--navy);border:2px solid var(--navy)}
  .btn-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
  .btn-row .btn{flex:1;min-width:140px;max-width:280px}

  /* ---------- question card ---------- */
  .q{padding:1.2rem 1.1rem;margin-bottom:1rem}
  .q .qnum{
    display:inline-block;background:var(--gold);color:var(--navy);
    border-radius:50px;padding:.18rem .8rem;font-family:var(--en);font-weight:800;font-size:.8rem;
    letter-spacing:.05em;margin-bottom:.65rem;
  }
  .q .qtext{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.2rem;line-height:1.4}
  .q .qen{font-family:var(--en);font-size:.95rem;color:var(--muted);font-style:italic;margin-bottom:.9rem}
  .opt{
    display:flex;align-items:flex-start;gap:.7rem;padding:.85rem 1rem;
    background:#fafbfd;border:2px solid var(--line);border-radius:12px;
    margin-bottom:.55rem;cursor:pointer;transition:all .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:hover{border-color:var(--navy2);background:#f0f2f8}
  .opt input{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;min-width:22px;border:2px solid var(--line);border-radius:50%;
    margin-top:.05rem;cursor:pointer;position:relative;background:#fff;
  }
  .opt input:checked{border-color:var(--navy);background:var(--navy)}
  .opt input:checked::after{
    content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--gold);
  }
  .opt.selected{border-color:var(--navy);background:#eff2fa}
  .opt .lbl{flex:1;font-size:1rem;line-height:1.4}
  .opt .lbl .en{font-family:var(--en);font-weight:600;color:var(--ink)}
  .opt .lbl .zh{display:block;color:var(--muted);font-size:.88em;margin-top:.1rem}

  /* ---------- result ---------- */
  .result-hero{text-align:center;padding:2rem 1rem 1.5rem}
  .score-big{font-family:var(--en);font-weight:900;font-size:clamp(3.5rem,15vw,5rem);color:var(--gold);line-height:1;letter-spacing:-.02em}
  .score-out{color:var(--muted);font-size:1rem;font-family:var(--en);font-weight:600;letter-spacing:.05em}
  .score-msg{margin-top:.7rem;font-size:1.15rem;color:var(--navy);font-weight:700}
  .score-msg .en{color:var(--muted);font-size:.9em;font-weight:500;font-style:italic;display:block;margin-top:.15rem}

  .review .qtext{margin-bottom:.55rem}
  .review .answer{
    margin-top:.7rem;padding:.7rem .9rem;border-radius:10px;font-size:.95rem;line-height:1.5;
  }
  .review.correct{border-top-color:var(--green)}
  .review.wrong{border-top-color:var(--red)}
  .verdict{
    display:inline-block;padding:.2rem .7rem;border-radius:50px;font-family:var(--en);font-weight:700;
    font-size:.78rem;letter-spacing:.05em;margin-bottom:.6rem;
  }
  .verdict.ok{background:#dff4e0;color:var(--green)}
  .verdict.ng{background:#fbe3e3;color:var(--red)}
  .your-ans{background:#fbe3e3;color:var(--red);border:1px solid #f3c7c7}
  .correct-ans{background:#dff4e0;color:var(--green);border:1px solid #b8e0bd}
  .explain{background:#fff8df;border:1px solid #f3e2a0;color:#5b4500;margin-top:.5rem}
  .answer b{font-weight:700}
  .answer .lbl-en{font-family:var(--en);font-weight:600}

  /* ---------- misc ---------- */
  .small{font-size:.85rem;color:var(--muted)}
  .err{background:#fbe3e3;border:1px solid #f3c7c7;color:var(--red);padding:.7rem .9rem;border-radius:10px;font-size:.9rem;margin-top:.8rem}
  .ok-flash{background:#dff4e0;border:1px solid #b8e0bd;color:var(--green);padding:.7rem .9rem;border-radius:10px;font-size:.9rem;margin-top:.8rem}
  .hidden{display:none}
  footer{text-align:center;padding:2rem 1rem 1rem;color:var(--muted);font-size:.78rem}
  footer a{color:var(--muted);text-decoration:none}

  @media (max-width:480px){
    header{padding:1.3rem 1rem 1.5rem}
    .panel{padding:1.2rem 1rem}
    main{padding:1rem .7rem 3rem}
  }
</style>
</head>
<body>

<header>
  <div class="badge en">Dragon Boat Festival Quiz</div>
  <h1>端午節英文小考</h1>
  <div class="en-title en">5 quick questions · about 1 minute</div>
</header>

<main>

  <!-- ========== Step 1: landing ========== -->
  <section id="step-landing" class="panel">
    <h2>👋 歡迎！</h2>
    <p class="sub">請先填基本資料，再開始作答 · Please fill in your info to start.</p>
    <form id="landing-form" autocomplete="off">
      <label class="field">
        <span class="lab">班級 <span class="en">/ Class</span></span>
        <input type="text" id="cls" name="cls" required maxlength="40"
               placeholder="例如：六年三班 / 你的學校名">
      </label>
      <label class="field">
        <span class="lab">英文名字 <span class="en">/ Your English name</span></span>
        <input type="text" id="name" name="name" required maxlength="40"
               placeholder="e.g. Mary, Kevin, Sophia">
      </label>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">開始作答  Start →</button>
      </div>
    </form>
  </section>

  <!-- ========== Step 2: questions ========== -->
  <section id="step-quiz" class="hidden">
    <div class="panel" style="border-top-color:var(--navy)">
      <p class="small"><span class="en" id="who-info"></span></p>
    </div>
    <form id="quiz-form" autocomplete="off"></form>
    <div class="btn-row">
      <button type="button" id="submit-btn" class="btn btn-primary">送出答案  Submit answers</button>
    </div>
    <div id="submit-err" class="err hidden"></div>
  </section>

  <!-- ========== Step 3: result ========== -->
  <section id="step-result" class="hidden">
    <div class="panel result-hero">
      <div class="score-big en"><span id="r-score">0</span></div>
      <div class="score-out en">OUT OF 5</div>
      <div class="score-msg" id="r-msg"></div>
    </div>
    <div id="r-review"></div>
    <div class="btn-row">
      <button type="button" id="again-btn" class="btn btn-secondary">再做一次  Try again</button>
    </div>
  </section>

</main>

<footer>
  <div>人師教育協會 My Culture Connect · <a href="https://changhua-bilingual.org/festivals" target="_blank" rel="noopener">changhua-bilingual.org/festivals</a></div>
</footer>

<script>
// ============================================================
// CONFIG — paste your Apps Script Web App URL here, then commit
// ------------------------------------------------------------
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzq8Qb9q0wNuuDdKkA0aG9hHGvzfgsujyvdmYARGGf2I9aMot_2iZhPmrM7t9HJDLahfA/exec";
// ============================================================

const QUESTIONS = [
  {
    q: "Q1. Which festival is celebrated by eating rice dumplings wrapped in bamboo leaves?",
    options: [
      "Lantern Festival",
      "Mid-Autumn Festival",
      "Dragon Boat Festival",
      "Chinese New Year"
    ],
    correct: 2,
    explain_en: "Rice dumplings (called \"zongzi\") are the traditional food of the Dragon Boat Festival.",
    explain_zh: "粽子（zongzi）是端午節的傳統食物。中秋節吃月餅、元宵節吃湯圓。"
  },
  {
    q: "Q2. What is the most famous activity at the Dragon Boat Festival?",
    options: [
      "Lighting paper lanterns",
      "Racing long, dragon-shaped boats",
      "Flying kites in the park",
      "Watching fireworks at night"
    ],
    correct: 1,
    explain_en: "Dragon boat racing is the festival's most iconic activity — that's where the name comes from.",
    explain_zh: "划龍舟是端午節最具代表性的活動，節日的英文名就是這樣來的。"
  },
  {
    q: "Q3. The Dragon Boat Festival honors an ancient Chinese poet. What is his name?",
    options: [
      "Li Bai",
      "Du Fu",
      "Qu Yuan",
      "Su Shi"
    ],
    correct: 2,
    explain_en: "Qu Yuan was a loyal minister and poet who lived over 2,000 years ago. The festival began as a way to remember him.",
    explain_zh: "屈原（Qu Yuan）是戰國時代楚國的詩人與忠臣，端午節最初就是為了紀念他。"
  },
  {
    q: "Q4. What does a \"zongzi\" look like?",
    options: [
      "A small, round, golden cake",
      "A pyramid-shaped rice bundle wrapped in green leaves",
      "A long, flat noodle in soup",
      "A clear, round ball made of jelly"
    ],
    correct: 1,
    explain_en: "A zongzi is a pyramid-shaped bundle of sticky rice wrapped in bamboo or reed leaves, often with filling inside.",
    explain_zh: "粽子是用竹葉或月桃葉包的三角錐形糯米飯，裡面通常有餡料。"
  },
  {
    q: "Q5. What does a dragon boat look like?",
    options: [
      "A small fishing boat with one sail",
      "A big white sailing ship",
      "A long, narrow boat with a carved dragon's head at the front",
      "A round bamboo raft"
    ],
    correct: 2,
    explain_en: "A dragon boat is long and narrow, paddled by a team, with a carved dragon's head at the bow and a tail at the stern.",
    explain_zh: "龍舟是又長又窄的舟船，由一隊人一起划，船頭雕著龍頭、船尾是龍尾。"
  }
];

// ---------------- state ----------------
const state = { cls: "", name: "", answers: new Array(QUESTIONS.length).fill(null), submitted: false };

// ---------------- helpers ----------------
function $(sel){ return document.querySelector(sel); }
function show(id){ ["step-landing","step-quiz","step-result"].forEach(s => $("#"+s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------------- step 1 → 2 ----------------
$("#landing-form").addEventListener("submit", (e) => {
  e.preventDefault();
  state.cls  = $("#cls").value.trim();
  state.name = $("#name").value.trim();
  if (!state.cls || !state.name) return;
  buildQuiz();
  show("step-quiz");
});

function buildQuiz(){
  $("#who-info").textContent = `${state.cls} · ${state.name}`;
  const form = $("#quiz-form");
  form.innerHTML = QUESTIONS.map((q, qi) => `
    <div class="panel q">
      <div class="qnum">QUESTION ${qi+1} / ${QUESTIONS.length}</div>
      <div class="qtext en">${esc(q.q)}</div>
      ${q.options.map((o, oi) => `
        <label class="opt" data-q="${qi}" data-o="${oi}">
          <input type="radio" name="q${qi}" value="${oi}">
          <div class="lbl en">${esc(o)}</div>
        </label>
      `).join("")}
    </div>
  `).join("");
  // selection styling
  form.addEventListener("change", (ev) => {
    if (ev.target.matches('input[type=radio]')){
      const qi = +ev.target.name.replace("q","");
      state.answers[qi] = +ev.target.value;
      // visually mark
      form.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(el => {
        el.classList.toggle("selected", +el.dataset.o === state.answers[qi]);
      });
    }
  });
}

// ---------------- submit ----------------
$("#submit-btn").addEventListener("click", async () => {
  const errBox = $("#submit-err");
  errBox.classList.add("hidden");
  // require all answered
  const missing = state.answers.findIndex(a => a === null);
  if (missing !== -1){
    errBox.textContent = `請先回答第 ${missing+1} 題 · Please answer Q${missing+1} first.`;
    errBox.classList.remove("hidden");
    // scroll into view
    const target = document.querySelectorAll(".q")[missing];
    if (target) target.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  // compute score
  let score = 0;
  const correctness = QUESTIONS.map((q, i) => {
    const ok = state.answers[i] === q.correct;
    if (ok) score++;
    return ok ? "✓" : "✗";
  }).join("");
  state.score = score;
  state.correctness = correctness;

  // POST to backend (fire-and-forget; we don't need the response)
  try {
    if (BACKEND_URL && !BACKEND_URL.startsWith("REPLACE_")){
      const body = new URLSearchParams({
        cls: state.cls,
        name: state.name,
        score: String(score),
        q1: optLabel(0), q2: optLabel(1), q3: optLabel(2), q4: optLabel(3), q5: optLabel(4),
        correctness
      });
      // no-cors: don't read response, just send.
      fetch(BACKEND_URL, { method: "POST", body, mode: "no-cors", keepalive: true })
        .catch(() => {}); // swallow — we move on regardless
    }
  } catch(e){ /* ignore */ }

  state.submitted = true;
  renderResult();
  show("step-result");
});

function optLabel(qi){
  const ai = state.answers[qi];
  if (ai == null) return "";
  return QUESTIONS[qi].options[ai];
}

// ---------------- result ----------------
function renderResult(){
  const score = state.score;
  $("#r-score").textContent = score;
  const msg = {
    5: { zh:"滿分！太棒了 🎉", en:"Perfect score! You know the festival inside out." },
    4: { zh:"很棒！只差一點點 ⭐", en:"Great job! Just one slip." },
    3: { zh:"不錯，下次更好 💪", en:"Good effort — you'll get there." },
    2: { zh:"再加油！多認識端午節 📚", en:"Keep going — there's more to learn!" },
    1: { zh:"沒關係，今天剛好可以學起來！", en:"No worries — today's a good day to learn." },
    0: { zh:"沒關係，今天剛好可以學起來！", en:"No worries — today's a good day to learn." }
  }[score];
  $("#r-msg").innerHTML = `${msg.zh}<span class="en">${msg.en}</span>`;

  $("#r-review").innerHTML = QUESTIONS.map((q, i) => {
    const ans = state.answers[i];
    const ok = ans === q.correct;
    const yourOpt   = q.options[ans];
    const correctOpt= q.options[q.correct];
    return `
      <div class="panel q review ${ok?'correct':'wrong'}">
        <span class="verdict ${ok?'ok':'ng'}">${ok ? "✓  CORRECT" : "✗  INCORRECT"}</span>
        <div class="qtext en">${esc(q.q)}</div>
        ${!ok ? `
          <div class="answer your-ans">
            <b>Your answer：</b>
            <span class="lbl-en">${esc(yourOpt)}</span>
          </div>
        ` : ``}
        <div class="answer correct-ans">
          <b>Correct answer：</b>
          <span class="lbl-en">${esc(correctOpt)}</span>
        </div>
        <div class="answer explain">
          <b>Explanation：</b> ${esc(q.explain_en)}
          <div class="zh" style="margin-top:.25rem;color:#5b4500">${esc(q.explain_zh)}</div>
        </div>
      </div>
    `;
  }).join("");
}

// ---------------- try again ----------------
$("#again-btn").addEventListener("click", () => {
  state.answers.fill(null);
  state.submitted = false;
  // rebuild quiz form so radios are unchecked
  buildQuiz();
  show("step-quiz");
});

// ---------------- init ----------------
show("step-landing");
</script>

</body>
</html>
